# Example bgpfcd configuration. The grammar is in docs/config.md.

router-id 192.0.2.1;
local-as 65000;

log { level info; }

listen { address ::; port 179; }

fib {
    mode dry-run;        # dry-run | install
    table main;
    protocol 186;        # rtnetlink route protocol bgpfc owns
}

control {
    socket /run/bgpfc/bgpfc.sock;
    http {
        listen 127.0.0.1:8179;
        writes no;       # reload/clear via HTTP are disabled by default
        # token-file /etc/bgpfc/api-token;
    }
}

# Route origin validation from an RPKI cache over RTR. RTR is plain TCP:
# keep the cache on this host or a trusted network (RFC 8210 §9). `invalid`
# says what to do with routes the VRPs show to be Invalid (RFC 6811 §5):
# `drop` keeps them out of the decision process, `prefer-valid` keeps them
# but lets every other route win, `policy` leaves them to your policies
# (`match rpki invalid;`). It is required: nothing is done unless you say so.
# rpki {
#     mode external;
#     invalid drop;
#     cache 127.0.0.1 port 3323;
# }
#
# Or have bgpfcd run Routinator itself, restart it when it fails, and read its
# VRPs over RTR on the loopback (docs/config.md, "The sidecar"). Routinator is
# a separate program that you install; the binary is never looked up on PATH.
# rpki {
#     mode sidecar;
#     invalid drop;
#     routinator {
#         binary /usr/bin/routinator;
#         repository-dir /var/lib/bgpfc/rpki;
#     }
# }

prefix-list BOGONS {
    10.0.0.0/8 le 32;
    192.168.0.0/16 le 32;
}

policy UPSTREAM-IN {
    term no-bogons { match prefix-list BOGONS; action reject; }
    term rest      { set local-pref 100; action accept; }
}

policy UPSTREAM-OUT {
    term own { match prefix 203.0.113.0/24; action accept; }
    term rest { action reject; }
}

neighbor 198.51.100.1 {
    remote-as 64511;
    description "transit";
    hold-time 90;
    families ipv4-unicast ipv6-unicast;
    import UPSTREAM-IN;
    export UPSTREAM-OUT;
}
