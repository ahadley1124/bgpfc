# bgpfcd for benchmarking with bgp_loadgen (docs/PROFILING.md). Needs no
# privileges: a high port and the dry-run FIB. The log is quiet so the
# profile lines stand out; they are written whatever the level.

router-id 192.0.2.1;
local-as 65000;

log { level warn; }

listen { address 127.0.0.1; port 11179; }

fib { mode dry-run; }

control { socket /tmp/bgpfc-bench.sock; }

policy ANY { term all { action accept; } }

# bgp_loadgen --connect 127.0.0.1:11179 (AS 65001 is its default).
neighbor 127.0.0.1 {
    remote-as 65001;
    passive yes;
    families ipv4-unicast ipv6-unicast;
    import ANY;
    export ANY;
}

# bgp_loadgen --listen 127.0.0.2:11180: bgpfcd connects to it, retrying
# every 5 seconds until it listens.
neighbor 127.0.0.2 {
    remote-as 65001;
    port 11180;
    connect-retry-time 5;
    families ipv4-unicast ipv6-unicast;
    import ANY;
    export ANY;
}
