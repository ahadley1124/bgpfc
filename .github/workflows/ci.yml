name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gates:
    name: fmt, clippy, test, check-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel; rustup picks it up.
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: scripts/check-deps.sh
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  miri:
    name: miri (wire, sys, fib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal -c miri -c rust-src
      - run: cargo +nightly miri setup
      - run: scripts/miri.sh

  fuzz:
    # Builds every cargo-fuzz target and runs each for a short while, so a
    # decoder panic on a shallow input is caught on every push. Long
    # campaigns are run by hand (fuzz/README.md).
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock', 'rust-toolchain.toml') }}
      - run: command -v cargo-fuzz || cargo install cargo-fuzz
      - run: cargo +nightly fuzz build --fuzz-dir fuzz
      - run: |
          for target in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- -max_total_time=20
          done

  interop:
    # Drives a real BIRD in network namespaces and peers it with bgpfcd;
    # needs root for the namespaces.
    name: interop (BIRD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: sudo apt-get update -q && sudo apt-get install -y -q bird2 iproute2
      - run: bird --version
      - run: cargo build -p bgpfcd -p interop --tests
      - run: sudo -E env PATH="$PATH" "$(command -v cargo)" test -p interop -- --include-ignored --test-threads=1
      # The privilege-drop test changes the test process's own uid, so it
      # runs on its own.
      - run: sudo -E env PATH="$PATH" "$(command -v cargo)" test -p bgpfc-sys -- --include-ignored root_drops
      - if: failure()
        run: for f in /tmp/bgpfc-interop-*/*.log; do echo "== $f"; cat "$f"; done
