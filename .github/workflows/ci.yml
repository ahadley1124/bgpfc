name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gates:
    name: fmt, clippy, test, check-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel; rustup picks it up.
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: scripts/check-deps.sh
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  profiling:
    # The same gates with the instrumentation compiled in (docs/PROFILING.md),
    # the load generator against the daemon, and one short benchmark run so
    # the tools keep working. Its figures are not compared: CI machines vary.
    name: profiling (clippy, test, loadgen, bench smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: profiling-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --features profiling -- -D warnings
      - run: cargo test --workspace --features profiling
      - run: cargo test -p bgpfcd --features profiling -- --ignored
      - run: cargo build --profile profiling --features profiling
      - run: target/profiling/bgp_bench --runs 1 --prefixes 50000 --results "$RUNNER_TEMP/results.csv"

  miri:
    name: miri (wire, sys, fib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal -c miri -c rust-src
      - run: cargo +nightly miri setup
      - run: scripts/miri.sh

  fuzz:
    # Builds every cargo-fuzz target and runs each for a short while, so a
    # decoder panic on a shallow input is caught on every push. Long
    # campaigns are run by hand (fuzz/README.md).
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock', 'rust-toolchain.toml') }}
      - run: command -v cargo-fuzz || cargo install cargo-fuzz
      - run: cargo +nightly fuzz build --fuzz-dir fuzz
      - run: |
          for target in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- -max_total_time=20
          done

  interop:
    # Drives BIRD, FRR and GoBGP in network namespaces and peers them with
    # bgpfcd, which takes VRPs from StayRTR, from interop's own stub cache
    # (rtr-stub) and from Routinator run as its sidecar; needs root for the
    # namespaces.
    name: interop (BIRD, FRR, GoBGP, StayRTR, Routinator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: sudo apt-get update -q && sudo apt-get install -y -q bird2 frr gobgpd stayrtr iproute2 curl openssl rsync
      # interop/tests/routinator.rs runs the real Routinator, from NLnet
      # Labs' own packages (Routinator's documentation, "Installation"):
      # their key, their repository for this Ubuntu release, and the 0.15
      # series, which bgpfc-sidecar's TESTED_VERSION belongs to and its
      # command line was written for. A new minor release must be checked
      # against that command line before CI takes it. The package enables
      # and starts a Routinator service of its own, which would fetch the
      # whole RPKI during the tests; it is stopped and disabled.
      - name: install Routinator 0.15 from packages.nlnetlabs.nl
        run: |
          curl -fsSL https://packages.nlnetlabs.nl/aptkey.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/nlnetlabs-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/nlnetlabs-archive-keyring.gpg] https://packages.nlnetlabs.nl/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/nlnetlabs.list
          sudo apt-get update -q
          sudo apt-get install -y -q 'routinator=0.15.*'
          sudo systemctl disable --now routinator.service
      - run: bird --version && /usr/lib/frr/bgpd --version | head -1 && gobgpd --version && stayrtr -version && routinator --version
      - run: cargo build -p bgpfcd -p bgpfcctl -p interop --tests
      - run: sudo -E env PATH="$PATH" "$(command -v cargo)" test -p interop -- --include-ignored --test-threads=1
      # The privilege-drop test changes the test process's own uid, so it
      # runs on its own.
      - run: sudo -E env PATH="$PATH" "$(command -v cargo)" test -p bgpfc-sys -- --include-ignored root_drops
      - if: failure()
        run: for f in /tmp/bgpfc-interop-*/*.log; do echo "== $f"; cat "$f"; done
