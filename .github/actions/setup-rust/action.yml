name: Set up Rust
description: >-
  Installs the Rust toolchain used by this repository. Kept as a composite
  action so the toolchain is defined in exactly one place.

inputs:
  toolchain:
    description: Rust toolchain to install.
    required: false
    default: stable

runs:
  using: composite
  steps:
    - name: Set up Rust
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        rustup toolchain install "$TOOLCHAIN" --no-self-update
        rustup override set "$TOOLCHAIN"
        rustc --version
        cargo --version
