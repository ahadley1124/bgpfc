[package]
name = "bgpfcd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "bgpfc BGP-4 routing daemon"

[dependencies]
bgpfc-prof = { workspace = true, optional = true }
bgpfc-config.workspace = true
bgpfc-control.workspace = true
bgpfc-fib.workspace = true
bgpfc-fsm.workspace = true
bgpfc-log.workspace = true
bgpfc-policy.workspace = true
bgpfc-rib.workspace = true
bgpfc-rpki.workspace = true
bgpfc-rtr.workspace = true
bgpfc-sys.workspace = true
bgpfc-wire.workspace = true

# docs/PROFILING.md: the load generator for tests/loadgen.rs.
[dev-dependencies]
bgpfc-bench.workspace = true

[features]
# docs/PROFILING.md: counters, histograms and the counting allocator. Off by
# default; the default build contains none of it.
profiling = [
    "dep:bgpfc-prof",
    "bgpfc-rib/profiling",
    "bgpfc-sys/profiling",
    "bgpfc-wire/profiling",
]

[lints]
workspace = true
