[package]
name = "bgpfc-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The only crate with unsafe code: hand-written extern \"C\" declarations for sockets, netlink and privileges"

[dependencies]

# AGENTS.md §1.3: this is the one crate allowed to contain `unsafe`. The
# workspace table forbids it, and `forbid` cannot be relaxed, so the table is
# repeated here with `deny`; each unsafe item carries its own `allow` and a
# `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "warn"
