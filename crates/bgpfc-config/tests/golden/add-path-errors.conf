# add-path: value errors, then a family the neighbor does not speak.
router-id 192.0.2.1;
local-as 65000;
policy A { term t { action accept; } }
neighbor 192.0.2.2 {
    remote-as 65001; import A; export A;
    add-path receive ipv4-unicast maybe;
    add-path receive ipv4-unicast yes;
    add-path receive ipv4-unicast no;
    add-path receive ipv4;
    add-path receive ipv4 yes;
    add-path send ipv4-unicast 0;
    add-path send ipv4-unicast many;
    add-path send ipv4-unicast 4294967296;
    add-path send ipv6-unicast 2;
    add-path send ipv6-unicast all;
    add-path both ipv6-unicast yes;
    add-path;
    add-path send ipv4-unicast 2 3;
}
