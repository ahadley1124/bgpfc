# graceful-restart: off by default, on with the BIRD and FRR defaults for
# the Restart Time (120 s) and FRR's for the stale time (360 s), or both
# given. Stating `no` with nothing else says nothing.
router-id 192.0.2.1;
local-as 65000;
policy A { term t { action accept; } }
neighbor 192.0.2.2 { remote-as 65001; import A; export A; }
neighbor 192.0.2.3 { remote-as 65001; import A; export A; graceful-restart yes; }
neighbor 192.0.2.4 {
    remote-as 65001; import A; export A;
    graceful-restart yes; restart-time 4095; stale-time 65535;
}
neighbor 192.0.2.5 { remote-as 65001; import A; export A; graceful-restart no; }
neighbor 192.0.2.6 {
    remote-as 65001; import A; export A;
    graceful-restart yes; restart-time 0; stale-time 1;
}
