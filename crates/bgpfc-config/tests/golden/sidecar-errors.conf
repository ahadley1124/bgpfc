# Settings of the routinator block that are wrong one by one: the binary is
# looked up on PATH instead of being named, RTR would be served beyond the
# loopback, and the numbers are out of range.
router-id 192.0.2.1;
local-as 65000;
rpki {
    mode sidecar;
    invalid drop;
    routinator {
        binary routinator;
        repository-dir var/lib/rpki;
        rtr-listen 192.0.2.1:3323;
        tal-dir tals;
        config-file routinator.conf;
        refresh 0;
        tal ripe;
        tal ripe;
        restart-backoff 90 30;
        stable-after 0;
        stop-timeout 7200;
        failure-threshold 0;
        rir-tals maybe;
        colour blue;
        refresh 600;
    }
}
