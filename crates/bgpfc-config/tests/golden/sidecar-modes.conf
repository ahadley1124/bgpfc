# The two sources of VRPs are alternatives. `mode sidecar` needs its block
# and the statement that says what to do with Invalid routes (RFC 8481 §5),
# and takes no cache: its RTR client connects to the sidecar's listener.
router-id 192.0.2.1;
local-as 65000;
rpki {
    mode sidecar;
    cache 127.0.0.1 port 3323;
}
