# enhanced-refresh: on by default (RFC 7313 §4: a speaker that supports it
# SHOULD advertise it), with FRR's 360 s for the stale time, or off, or
# given a stale time. Stating `yes` says nothing more than the default.
router-id 192.0.2.1;
local-as 65000;
policy A { term t { action accept; } }
neighbor 192.0.2.2 { remote-as 65001; import A; export A; }
neighbor 192.0.2.3 { remote-as 65001; import A; export A; enhanced-refresh yes; }
neighbor 192.0.2.4 { remote-as 65001; import A; export A; enhanced-refresh no; }
neighbor 192.0.2.5 { remote-as 65001; import A; export A; refresh-stale-time 90; }
neighbor 192.0.2.6 {
    remote-as 65001; import A; export A;
    enhanced-refresh yes; refresh-stale-time 65535;
}
neighbor 192.0.2.7 { remote-as 65001; import A; export A; refresh-stale-time 1; }
