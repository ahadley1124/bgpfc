router-id 0.0.0.0;
router-id 192.0.2.1;
local-as 0;
log { level loud; }
listen { port 179; }
fib { mode maybe; table main; }
control { http { listen 192.0.2.1:8179; writes perhaps; } }
prefix-list P {
    10.0.0.0/8 le 7;
    10.0.0.0/33;
    10.0.0.0/8 ge 24 le 16;
    10.0.0.0/8 gt 9;
}
policy A {
    term t { match prefix-list; set community add; action maybe; }
    term t { action accept; }
    term u { match as-path ^65000$; }
    term v { set as-path 65000; set next-hop peer; set local-pref x; action accept; }
    term w { match rpki unknown; match rpki valid invalid; set rpki disabled; set rpki maybe; action accept; }
    bogus;
}
neighbor nowhere { remote-as 1; import A; export A; }
neighbor 192.0.2.2 {
    remote-as 65001;
    remote-as 65001;
    hold-time 2;
    families ipv4-unicast ipv4-unicast;
    passive maybe;
    unknown-thing 1;
    advertisement-interval 65536;
    advertisement-interval 5;
    extended-next-hop ipv4;
    restart-limit never;
    restart-limit 5;
    maximum-prefix ipv4-unicast 0;
    maximum-prefix ipv4-unicast;
    maximum-prefix ipv4 10;
    maximum-prefix ipv6-unicast 10;
    maximum-prefix ipv6-unicast 20;
}
rpki {
    mode sometimes;
    enforcement drop;
    enforcement prefer-valid off;
    startup wait;
    startup hold accept;
    cache 192.0.2.1 port 0;
    cache -bad-.example;
    cache 10.1;
    cache [2001:db8::1];
    cache 192.0.2.2 port;
    cache 192.0.2.3 weight 5;
    cache 192.0.2.4 port 3323 port 3324;
    cache 192.0.2.5 preference -1;
    cache RTR.example.NET;
    cache rtr.example.net. port 323;
    cache 2001:db8::1;
    cache 2001:0db8::1 preference 3;
    version 2;
    connect-timeout 0;
    response-timeout soon;
    max-expire 300;
    max-expire 3600;
    max-vrps 0;
    backoff 10 5;
    backoff 0 7201;
    backoff 1;
    frobnicate yes;
}
rpki { cache 192.0.2.9; }
