router-id 0.0.0.0;
router-id 192.0.2.1;
local-as 0;
log { level loud; }
listen { port 179; }
fib { mode maybe; table main; }
control { http { listen 192.0.2.1:8179; writes perhaps; } }
prefix-list P {
    10.0.0.0/8 le 7;
    10.0.0.0/33;
    10.0.0.0/8 ge 24 le 16;
    10.0.0.0/8 gt 9;
}
policy A {
    term t { match prefix-list; set community add; action maybe; }
    term t { action accept; }
    term u { match as-path ^65000$; }
    term v { set as-path 65000; set next-hop peer; set local-pref x; action accept; }
    bogus;
}
neighbor nowhere { remote-as 1; import A; export A; }
neighbor 192.0.2.2 {
    remote-as 65001;
    remote-as 65001;
    hold-time 2;
    families ipv4-unicast ipv4-unicast;
    passive maybe;
    unknown-thing 1;
}
