# Policy that matches and sets the origin validation state (RFC 6811 §3).
router-id 192.0.2.1;
local-as 65000;
policy FROM-IBGP {
    # An iBGP neighbor that validates tells its state in a community
    # (RFC 6811 §5); this router takes it as the state.
    term said-invalid { match community 65000:666; set rpki invalid; action next; }
    term said-valid { match community 65000:200; set rpki valid; action next; }
    term drop-invalid { match rpki invalid; action reject; }
    term rest { action accept; }
}
policy PREFER {
    term valid { match rpki valid; set local-pref 200; action accept; }
    term not-found { match rpki not-found; set local-pref 100; action accept; }
    term unchecked { match rpki disabled; set rpki not-found; action accept; }
}
neighbor 192.0.2.2 { remote-as 65000; import FROM-IBGP; export PREFER; }
