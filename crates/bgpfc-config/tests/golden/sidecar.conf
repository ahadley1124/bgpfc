# The smallest sidecar block: the mode, what to do with Invalid routes
# (RFC 8481 §5: nothing unless the operator says so) and the two things
# Routinator cannot do without, its binary and its repository directory.
# Everything else takes its default: RTR on 127.0.0.1 with a port picked at
# start, the RIR TALs without ARIN's, a ten minute refresh.
router-id 192.0.2.1;
local-as 65000;
rpki {
    mode sidecar;
    invalid drop;
    routinator {
        binary /usr/bin/routinator;
        repository-dir /var/lib/bgpfc/rpki;
    }
}
