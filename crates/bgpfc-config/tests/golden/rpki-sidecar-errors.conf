# Every error the sidecar block and the modes can give, each at its
# position. A file has one rpki block, so every block after the first is
# also reported as given more than once.
router-id 192.0.2.1;
local-as 65000;
rpki {
    mode sidecar;
    cache 127.0.0.1;                    # caches are for mode external
    sidecar {
        binary routinator;              # not absolute: PATH is never searched
        repository-dir var/lib/rpki;    # relative
        config-file routinator.conf;    # relative
        extra-tals-dir tals;            # relative
        rtr-listen 192.0.2.1;           # not loopback
        refresh 0;
        restart-backoff 0 5;
        stable-after 0;
        stop-timeout 0;
        failure-threshold 0;
        tals;                           # no TAL named
        global-args;                    # no argument
        frobnicate yes;
    }
}
rpki {
    mode sidecar;
    sidecar {
        binary /usr/bin/routinator;
        binary /usr/local/bin/routinator;   # given twice
        rtr-listen ::ffff:127.0.0.1;    # IPv4-mapped: not loopback as read
        refresh 7200;                   # not below Routinator's Expire Interval
        restart-backoff 1 3601;
        stable-after 86401;
        stop-timeout 3601;
    }
}
rpki {
    mode sidecar;
    sidecar {
        rtr-listen 127.0.0.1 port 323;  # privileged: Routinator has no capabilities
        restart-backoff 10 5;           # cap below the initial delay
    }
}
rpki {
    mode sidecar;
    sidecar;                            # no block
}
rpki {
    mode disabled;                      # the block is still read
    sidecar { rtr-listen 127.0.0.1 prt 3323; }
}
rpki {
    mode external;
    cache 192.0.2.10;
    sidecar { }                         # never run with mode external
}
rpki { mode bogus; }
