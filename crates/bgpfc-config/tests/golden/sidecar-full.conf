# Every statement of the routinator block, and the client statements of the
# rpki block that apply to the connection to the sidecar.
router-id 192.0.2.1;
local-as 65000;
rpki {
    mode sidecar;
    invalid prefer-valid;
    version 0;
    backoff 1 30;
    max-vrps 1000000;
    routinator {
        binary /opt/routinator/bin/routinator;
        repository-dir /var/lib/bgpfc/rpki;
        rtr-listen [::1]:3323;
        rir-tals no;
        tal ripe;
        tal apnic;
        tal ripe-pilot;
        tal-dir /etc/bgpfc/tals;
        accept-arin-rpa no;
        refresh 300;
        config-file /etc/bgpfc/routinator.conf;
        global-arg "--strict";
        server-arg "--http=127.0.0.1:8323";
        server-arg "--rrdp-timeout=30";
        restart-backoff 2 120;
        stable-after 600;
        stop-timeout 20;
        failure-threshold 3;
    }
}
