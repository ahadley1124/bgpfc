# Settings that are each well-formed but do not fit together, and a mode
# without the statement it needs.
router-id 192.0.2.1;
local-as 65000;
rpki {
    mode external;           # no cache to take the VRPs from, and no `invalid`
    connect-timeout 90;      # longer than the default response-timeout, 60
    reply-timeout 30;        # shorter than it
}
