# What a `match rpki` and a `set rpki` refuse.
router-id 192.0.2.1;
local-as 65000;
policy P {
    term a { match rpki; action accept; }
    term b { match rpki unknown; action accept; }
    term c { match rpki valid invalid; action accept; }
    term d { match rpki Valid; action accept; }
    term e { set rpki; action accept; }
    term f { set rpki notfound; action accept; }
    term g { set rpki valid invalid; action accept; }
}
