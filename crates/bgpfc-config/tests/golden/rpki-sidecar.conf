# An rpki block that runs Routinator as bgpfcd's sidecar, with every
# statement of the sidecar block written out and none at its default.
router-id 192.0.2.1;
local-as 65000;
rpki {
    mode sidecar;
    enforcement prefer-valid;
    connect-timeout 5;
    backoff 2 60;
    sidecar {
        binary /opt/routinator/bin/routinator;
        repository-dir "/var/lib/bgpfc/rpki cache";
        rtr-listen ::1 port 3323;
        rir-tals no;
        tals ripe ripe-pilot;
        extra-tals-dir /etc/bgpfc/tals;
        accept-arin-rpa yes;
        refresh 300;
        config-file /etc/bgpfc/routinator.conf;
        # Arguments are passed verbatim; a quoted one may hold anything.
        global-args --strict "--exceptions=/etc/bgpfc/slurm;local.json";
        server-args --rtr-tcp-keepalive=30 "--http=127.0.0.1:8323";
        restart-backoff 2 600;
        stable-after 900;
        stop-timeout 20;
        failure-threshold 3;
    }
}
