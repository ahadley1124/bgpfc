# enhanced-refresh: bad values, repeated statements, and the stale time
# without Enhanced Route Refresh on.
router-id 192.0.2.1;
local-as 65000;
policy A { term t { action accept; } }
neighbor 192.0.2.2 {
    remote-as 65001; import A; export A;
    enhanced-refresh maybe;
    enhanced-refresh yes;
    enhanced-refresh no;
    refresh-stale-time 0;
    refresh-stale-time 65536;
    refresh-stale-time long;
    refresh-stale-time 360;
    refresh-stale-time;
    refresh-stale-time 1 2;
}
neighbor 192.0.2.3 { remote-as 65001; import A; export A; enhanced-refresh no; refresh-stale-time 360; }
