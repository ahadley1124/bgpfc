router-id 192.0.2.1;
local-as 65000;
policy A {
    term t { match prefix-list MISSING; action accept; }
}
neighbor 192.0.2.2 { remote-as 65001; import A; export B; }
neighbor 192.0.2.2 { remote-as 65001; import A; export A; }
neighbor 192.0.2.3 {
    remote-as 65001; import A; export A;
    hold-time 30; keepalive-time 30; send-hold-time 30;
}
neighbor 2001:db8::4 {
    remote-as 65001; import A; export A;
    families ipv6-unicast; extended-next-hop yes;
    maximum-prefix ipv4-unicast 10;
}
neighbor 192.0.2.5 { remote-as 65000; import A; export A; role peer; }
neighbor 192.0.2.6 { remote-as 65000; import A; export A; role customer; role-strict yes; }
neighbor 192.0.2.7 { remote-as 65001; import A; export A; role rs; role-strict yes; }
