router-id 192.0.2.1;
local-as 65000;
policy A {
    term t { match prefix-list MISSING; action accept; }
}
policy S {
    term s { match rpki invalid; set rpki valid; action accept; }
}
neighbor 192.0.2.2 { remote-as 65001; import A; export B; }
neighbor 192.0.2.2 { remote-as 65001; import A; export A; }
neighbor 192.0.2.3 {
    remote-as 65001; import A; export A;
    hold-time 30; keepalive-time 30; send-hold-time 30;
}
neighbor 2001:db8::4 {
    remote-as 65001; import A; export A;
    families ipv6-unicast; extended-next-hop yes;
    maximum-prefix ipv4-unicast 10;
}
neighbor 192.0.2.5 { remote-as 65001; import S; export S; }
neighbor 192.0.2.6 { remote-as 65001; import S; export A; }
neighbor 2001:db8::7 { remote-as 65001; import A; export A; local-address 192.0.2.1; }
neighbor 192.0.2.8 { remote-as 65001; import A; export A; local-address 0.0.0.0; }
neighbor 192.0.2.9 { remote-as 65001; import A; export A; local-address 224.0.0.5; }
neighbor 192.0.2.10 { remote-as 65001; import A; export A; local-address 192.0.2.10; }
neighbor 2001:db8::11 { remote-as 65001; import A; export A; local-address fe80::1; }
