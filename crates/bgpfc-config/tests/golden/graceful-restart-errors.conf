# graceful-restart: bad values, repeated statements, and the two tuning
# statements without Graceful Restart on.
router-id 192.0.2.1;
local-as 65000;
policy A { term t { action accept; } }
neighbor 192.0.2.2 {
    remote-as 65001; import A; export A;
    graceful-restart maybe;
    graceful-restart yes;
    graceful-restart no;
    restart-time 4096;
    restart-time soon;
    restart-time 120;
    restart-time 121;
    stale-time 0;
    stale-time 65536;
    stale-time long;
    stale-time 360;
    stale-time 361;
    restart-time;
    stale-time 1 2;
}
neighbor 192.0.2.3 { remote-as 65001; import A; export A; restart-time 120; }
neighbor 192.0.2.4 { remote-as 65001; import A; export A; stale-time 360; graceful-restart no; }
