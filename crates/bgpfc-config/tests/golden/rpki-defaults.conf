# An rpki block that states only what it must: the mode, one cache and what
# to do with Invalid routes (RFC 8481 §5: nothing is done unless the operator
# says so). Everything else takes its default.
router-id 192.0.2.1;
local-as 65000;
rpki {
    mode external;
    invalid drop;
    cache rtr.example.net;
}
