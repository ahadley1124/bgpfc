# add-path names a family the neighbor speaks, or `no` / `off`, which say nothing.
router-id 192.0.2.1;
local-as 65000;
policy A { term t { action accept; } }
neighbor 2001:db8::4 {
    remote-as 65001; import A; export A;
    families ipv6-unicast;
    add-path receive ipv4-unicast yes;
    add-path send ipv4-unicast 2;
    add-path receive ipv6-unicast yes;
    add-path send ipv6-unicast all;
}
neighbor 2001:db8::5 {
    remote-as 65001; import A; export A;
    families ipv6-unicast;
    add-path receive ipv4-unicast no;
    add-path send ipv4-unicast off;
}
