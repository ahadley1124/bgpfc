# Every statement the grammar knows.
router-id 10.0.0.1;
local-as 4200000000;
log { level debug; }
listen { address 10.0.0.1; }
listen { address 2001:db8::1; port 1179; }
fib { mode install; table 100; protocol 200; }
control {
    socket /tmp/bgpfc.sock;
    http { listen [::1]:8179; writes yes; token-file /etc/bgpfc/token; }
}
prefix-list V6 {
    2001:db8::/32 ge 48 le 64;
    ::/0;
}
policy IN {
    term a {
        match prefix 10.0.0.0/8 ge 16 le 24;
        match prefix-list V6;
        match as-path "^65001 .* 65002$";
        match community 65000:100;
        match ext-community as2:2:65000:1;
        match large-community 65000:1:2;
        match origin igp;
        match neighbor 10.0.0.2;
        set local-pref 200;
        set med 10;
        set community add 65000:1 no-export;
        set ext-community remove ipv4:2:192.0.2.1:1;
        set large-community replace 65000:0:0;
        set as-path prepend 65000 65000;
        set next-hop self;
        action next;
    }
    term b { action accept; }
}
policy OUT { term all { action reject; } }
neighbor 10.0.0.2 {
    remote-as 65001;
    description "v4 peer";
    port 1179;
    hold-time 30;
    keepalive-time 5;
    connect-retry-time 10;
    send-hold-time 120;
    families ipv4-unicast;
    import IN;
    export OUT;
    passive yes;
    allow-as-set yes;
    collision-detect-established yes;
}
neighbor 2001:db8::2 {
    remote-as 65002;
    hold-time 0;
    send-hold-time off;
    import IN;
    export OUT;
}
